[versions]
agp = "8.12.1"
kotlin = "2.2.10"
google-services = "4.4.3"
androidx-core = "1.17.0"
appcompat = "1.7.1"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
junit = "4.13.2"
androidx-junit = "1.3.0"
espresso-core = "3.7.0"
firebase-bom = "34.1.0"
recyclerview = "1.4.0"
swiperefreshlayout = "1.1.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt         = { id = "org.jetbrains.kotlin.kapt",    version.ref = "kotlin" }   # ⬅️ TAMBAHKAN INI
google-services     = { id = "com.google.gms.google-services", version.ref = "google-services" }

[libraries]
androidx-core-ktx        = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat       = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material                 = { module = "com.google.android.material:material", version.ref = "material" }
androidx-activity        = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-constraintlayout= { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
junit                    = { module = "junit:junit", version.ref = "junit" }
androidx-junit           = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-espresso-core   = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
firebase-bom             = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics       = { module = "com.google.firebase:firebase-analytics" }
firebase-database        = { module = "com.google.firebase:firebase-database" }
firebase-storage         = { module = "com.google.firebase:firebase-storage" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
